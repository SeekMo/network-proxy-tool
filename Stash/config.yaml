# 基于以下配置文件作为参考进行修改
#  - https://stash.wiki/configuration/example-config
#  - https://raw.githubusercontent.com/rokcso/dimrail/main/configs/clash.yaml
#  - https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Stash/Config.yaml
#  - https://raw.githubusercontent.com/Moli-X/Tool/X/Stash/Stash.yaml

# Stash 官方指南
#  - https://stash.wiki/


# ===================================局==
# 规则模式：rule（规则） / global（全局代理）/ direct（全直连）
# =====================================
mode: rule


# =====================================
# 5 个级别：silent / info / warning / error / debug。级别越高日志输出量越大，越倾向于调试，若需要请自行开启
# =====================================
log-level: silent


# =====================================
# 
# =====================================
http:
  # 强制使用 HTTP 引擎处理 TCP 连接
  # 捕获后的连接可以使用高级功能，例如重写和脚本
  force-http-engine:
  # 无 MitM / 脚本需求时，可先将其屏蔽，避免全量拦截 80 端口造成的纯性能开销
    # - '*:80'
 
  # 以 PKCS #12 编码的 CA 证书
  ca: ''
  # 证书密码
  ca-passphrase: ''
  # 开启中间人攻击（MitM）功能的域名列表，需要确保上述 CA 证书已受系统信任
  mitm:
    # - g.cn
    # - '*.google.cn'
    # - weather-data.apple.com # 默认只对 443 端口开启
    # - weather-data.apple.com:* # 使用通配符对所有端口开启
    # - '*.weather-data.apple.com' # 域名中也可以使用通配符
    # - '-exclude.weather-data.apple.com' # 用-前缀排除域名
    - '-gateway.icloud.com'
    - '-gateway.icloud.com.cn'
    - '-weather-data.apple.com'
    - '-buy.itunes.apple.com'

  # HTTP(S) 重写，支持 header、302、307、reject 多种策略
  url-rewrite:
    - ^http://g\.cn http://www.google.com header # 重写请求头的域名
    - ^https?://ad\.example - reject # 拒绝请求
    - ^https?://www\.google\.cn https://www.google.com 302 # 直接返回一个 302 重定向的响应
 
  # 使用 JavaScript 脚本改写 HTTP(S) 请求
  script:
    # - match: https://weather-data.apple.com/v2/weather/[\w-]+/-?[0-9]+\.[0-9]+/-?[0-9]+\.[0-9]+\?
    #   name: weather-us-aqi # 引用 script-providers 中的脚本
    #   type: response # 脚本类型：request / response
    #   require-body: true # 如果需要 request / response body，请设置为 true
    #   timeout: 10 # 脚本超时时间（秒，可选）
    #   argument: '' # 脚本参数（可选）
    #   debug: false # 开发模式，每次执行前会从 provider 加载最新脚本
    #   binary-mode: false # 以二进制模式获取 body
    #   max-size: 1048576 # 1MB


# =====================================
# 定时任务
# =====================================
cron:
  # 定时执行 JavaScript 脚本
  script:
    # - name: weather-us-aqi # 引用 script-providers 中的脚本
    #   cron: '* * * * *' # cron 表达式，可以在 https://crontab.guru/ 获取更多介绍
    #   timeout: 10 # 脚本超时时间（秒，可选）
    #   argument: '' # 脚本参数（可选）
    #   debug: false # 开发模式，每次执行前会从 provider 加载最新脚本


# =====================================
# 脚本
# =====================================
script-providers:
  # weather-us-aqi:
  #   url: https://example.org/stash/script.js
  #   interval: 86400


# =====================================
# 脚本
# =====================================
script:
  # 使用表达式编写自定义规则
  shortcuts: 
    # QUIC 回落：拒绝 UDP 443 等端口，迫使浏览器/App 回落到 TCP + TLS
    # 注意：[rules] 配置项的 "SCRIPT,quic,REJECT,no-track" 依赖此定义，
    #       若不想拦截 QUIC，请同时注释掉 [rules] 段那一行，而不是只注释这里。
    quic: network == 'udp' and (dst_port == 443 or dst_port == 4483 or dst_port == 9305)

    # WebRTC 硬编码 STUN 拦截 —— 补齐 fake-ip-filter 管不到的绕过路径
    # 【为什么需要】fake-ip-filter 只能拦「先查 DNS 再连接」的流量。
    #   网页 JS 可以直接对 STUN 服务器的 IP 字面量发 UDP（例如
    #   74.125.250.129:19302），全程不产生 DNS 查询，fake-ip 完全失效。
    #   只有按端口拦截才能封死这条路。
    # 【端口选择】19302-19309 是 Google 公共 STUN 的固定端口，也是浏览器
    #   WebRTC 的事实默认。游戏主机不使用这段端口，因此拦截它不影响
    #   PS / Switch / Xbox 的 NAT 检测（主机走的是 3478-3480）。
    webrtc-stun: network == 'udp' and (dst_port == 19302 or dst_port == 19303 or dst_port == 19304 or dst_port == 19305 or dst_port == 19306 or dst_port == 19307 or dst_port == 19308 or dst_port == 19309)

    # 【严格模式，默认关闭】连标准 STUN/TURN 端口一起拦。
    #   3478/3479 = STUN/TURN 明文，5349/5350 = STUN/TURN over TLS/DTLS。
    #   ⚠️ 代价明确：PS / Switch / Xbox 正是用 3478-3480 做 NAT 类型检测，
    #      开启后主机联机会退化为 NAT 3（严格），部分游戏无法组队。
    #      同时会影响所有依赖标准 STUN 的桌面通话软件。
    #   仅在「完全不联机、隐私优先级最高」时放开，并同步启用下方 [rules] 里对应行。
    # webrtc-stun-strict: network == 'udp' and (dst_port == 3478 or dst_port == 3479 or dst_port == 5349 or dst_port == 5350)


# =====================================
# 支持通配符域名（例如: *.clash.dev, *.foo.*.example.com）
# 不使用通配符的域名优先级高于使用通配符的域名（例如: foo.example.com > *.example.com > .example.com）
# 注意: +.foo.com 的效果等同于 .foo.com 和 foo.com
# =====================================
hosts:
  # '*.clash.dev': 127.0.0.1
  # '.dev': 127.0.0.1
  # 'alpha.clash.dev': '::1'


# =====================================
# DNS 服务器配置
# 本段参数以 Stash 官方文档为准：https://stash.wiki/features/dns-server
# dns 下合法键仅 7 个：nameserver / default-nameserver / proxy-server-nameserver /
#                     nameserver-policy / follow-rule / skip-cert-verify / fake-ip-filter
# 顶层另有 hosts（见 https://stash.wiki/features/hostname-mapping）
# =====================================
dns:
  # 加密 DNS Bootstrap：仅用于解析下方 nameserver 中 DNS 服务器自身的域名。
  # 官方原文：除 system 外，服务器地址必须使用 IP。此处需保证绝对可达，故用纯 IP。
  default-nameserver:
    # DoH3 基于 QUIC，握手更快、抗丢包更好（官方示例即此地址），但 1.1.1.1 在国内常被干扰，作为 bootstrap 不够稳，默认不启用
    # - 'https://1.1.1.1/dns-query#h3=true'
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
    - 119.28.28.28
    - system # 使用 iOS 系统 DNS

  # 支持 system / UDP / TCP / DoT / DoH / DoH3 / DoQ 协议，可指明具体端口号。
  # 所有 DNS 请求直接发送到服务器，不经过任何代理（除非开启 follow-rule）。
  # Stash 会并发请求所有服务器，并采用最快响应的结果
  nameserver:
    # 不建议配置超过 2 个 DNS 服务器，会增加系统功耗
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

    # DoH3 / DoQ：Stash 均已支持。但 fake-ip 下真正会发起上游查询的只有
    # fake-ip-filter 中的域名，那些几乎全是国内/本地域名 —— 用境外加密 DNS
    # 解析只会更慢、破坏 CDN 就近，且因「取最快响应」而永远竞争不过上面两条，
    # 等于白白增加并发查询与耗电。故默认不启用，需要时放开。
    # - 'https://1.1.1.1/dns-query#h3=true'  # DoH3；地址必须加引号，否则 #h3=true 被 YAML 当作注释
    # - quic://dns.adguard.com:853           # DoQ

    # 隐私提示：既然取「最快响应」，运营商 DNS 几乎总是快于加密 DNS，只要保留 system，上面两条 DoH 就基本不会被采用，明文查询仍可被运营商观测。要真正提升 DNS 隐私，应屏蔽 system，而不是继续往下追加加密 DNS。
    # 注意：屏蔽 system 后，连接 酒店/机场 这类需要网页登录的 WiFi 时会卡住，原因：DoH 走不通 → DNS 全断 → 连 captive.apple.com 都解析不了 → 弹不出登录页。可以先登录连接 WiFi 成功后，再启动 代理软件。
    # - system # 使用系统 DNS

  # DNS 查询跟随规则。默认 Stash 的 DNS 查询直接出站、不经代理。
  # 官方警告：绝大部分场景无需开启，会破坏云服务商 CDN 全球优化策略并增加延迟。
  # 注意它并不能让下方 nameserver-policy 对「走代理的域名」生效，原因见 policy 内注释。
  follow-rule: false

  # 代理服务器域名解析（iOS/tvOS 3.6+、macOS 4.3+）
  # 独立查询链路、不跟随代理规则，避免「连节点前要先解析节点域名」的递归查询
  proxy-server-nameserver:
    - 223.5.5.5
    - https://dns.alidns.com/dns-query

  # 跳过证书验证，解决部分兼容性问题 https://help.nextdns.io/t/g9hdkjz
  skip-cert-verify: false

  # DNS 分流策略，对部分域名使用单独的 DNS 服务器。
  # 支持精确域名、通配域名、geosite:<name>；优先级：精确 > 通配 > geosite
  nameserver-policy:
    # 为何下方境外域名全部屏蔽：
    #   不在 fake-ip-filter 中的域名会直接返回假 IP，不产生上游查询，因此为「走代理的域名」指定 DoH 属于无效配置 —— follow-rule 也改变不了这一点。
    #   要让其生效必须先把域名加入 fake-ip-filter，但那样客户端会拿到真实 IP 进行直连，Stash 只看得到目标 IP，DOMAIN 类规则失配，分流反而降级。
    #   而 fake-ip 下这些域名本就由节点在出口侧解析（无污染、CDN 就近），已是更优解。【保留的三条】仅对 fake-ip-filter 中的对应域名生效（如 +.kuwo.cn、*.melogin.cn）
    
    # # AI 服务使用 Cloudflare DNS
    # '+.openai.com': https://cloudflare-dns.com/dns-query
    # '+.chatgpt.com': https://cloudflare-dns.com/dns-query
    # '+.anthropic.com': https://cloudflare-dns.com/dns-query
    # '+.claude.ai': https://cloudflare-dns.com/dns-query
    # '+.gemini.google.com': https://cloudflare-dns.com/dns-query
    # '+.perplexity.ai': https://cloudflare-dns.com/dns-query
    # # Google
    # '+.google.com': https://dns.google/dns-query
    # '+.googleapis.com': https://dns.google/dns-query
    # '+.gstatic.com': https://dns.google/dns-query
    # '+.ggpht.com': https://dns.google/dns-query
    # '+.youtube.com': https://dns.google/dns-query
    # '+.ytimg.com': https://dns.google/dns-query
    # '+.googlevideo.com': https://dns.google/dns-query
    # # GitHub 
    # '+.github.com': https://dns.google/dns-query
    # '+.githubusercontent.com': https://dns.google/dns-query
    # '+.githubassets.com': https://dns.google/dns-query
    # # Telegram
    # '+.telegram.org': https://cloudflare-dns.com/dns-query
    # '+.t.me': https://cloudflare-dns.com/dns-query

    # 国内域名使用国内 DNS
    # 'geosite:cn':
    #   - 223.5.5.5
    #   - 119.29.29.29
    '+.cn': https://dns.alidns.com/dns-query
    '+.douyin.com': https://dns.alidns.com/dns-query
    '+.bilibili.com': https://dns.alidns.com/dns-query
 
  # 在以下列表的域名将不会被解析为 fake ip，这些域名相关的解析请求将会返回它们真实的 IP 地址
  fake-ip-filter:
    # > 本地 / 局域网
    - '*.lan'
    - '*.direct'
    - '*.localdomain'
    - '*.example'
    - '*.invalid'
    - '*.localhost'
    - '*.test'
    - '*.local'
    - '*.home.arpa'
    - '*.corp'
    - '*.internal'

    # > STUN / TURN —— 隐私与 P2P 的取舍区（当前策略：隐私优先）
    # ---------------------------------------------------------------
    # 【原理】STUN 的作用是让客户端问服务器「你看到的我的公网 IP 是多少」。
    #   · 放行（写进本列表）→ 返回真实 IP → STUN 可用 → P2P 打洞成功
    #                                      → 但浏览器 WebRTC 也能拿到你的真实公网 IP
    #   · 屏蔽（注释掉）    → 返回 fake IP → STUN 请求发不出去
    #                                      → WebRTC 的 srflx candidate 收集失败，探测不到真实 IP
    #
    # 【自测】开启代理后访问 https://browserleaks.com/webrtc
    #   若显示的 IP 与 https://httpbin.org/ip 不一致，即存在泄漏。
    #
    # 【更优解】若节点支持 UDP 转发（proxies 里 udp: true）且使用 TUN 模式，
    #   可以放行 STUN 的同时把它走代理 —— 此时 WebRTC 拿到的是节点 IP，
    #   既不泄漏也能打洞。此方案需在 [rules]配置项 为下列域名指定代理策略。
    # ---------------------------------------------------------------

    # 【A 组】通用公共 STUN 通配 —— 泄漏风险最高，默认屏蔽
    # 这些通配会覆盖互联网上任意 STUN 服务器，等于对所有网页开放 IP 探测。
    # 除非明确需要，否则不要放开。
    # - 'stun.*'
    # - '+.stun.*.*'
    # - '+.stun.*.*.*'
    # - '+.stun.*.*.*.*'
    # - '+.stun.*.*.*.*.*'

    # 【B 组】浏览器 WebRTC 通话服务 —— 中等风险，按需放开
    # 这些是网页版视频通话真正会用到的 STUN/TURN 服务器。
    # 放开后 Google Meet / 网页版会议 / Discord 网页端的 P2P 才能正常建立，
    # 但同一批服务器也是恶意网页探测真实 IP 的首选目标（尤其 Google 那几个，
    # 它们是 WebRTC 的事实默认 STUN）。要用视频会议时再逐条放开。
    # - 'stun.l.google.com'
    # - 'stun1.l.google.com'
    # - 'stun2.l.google.com'
    # - 'stun3.l.google.com'
    # - 'stun4.l.google.com'
    # - 'global.stun.twilio.com'
    # - 'global.turn.twilio.com'

    # 【C 组】独立 App 的音视频通话 —— 无需在此配置，说明见下
    # Telegram / WhatsApp / 微信 / FaceTime 的语音视频，走的是各自私有的
    # reflector / relay 服务器（如 Telegram 的 DC 节点、WhatsApp 的 relay），
    # 并不依赖公共 STUN 域名，因此 A/B 两组的开关不影响它们。
    # 它们也不构成浏览器 WebRTC 泄漏面 —— 网页 JS 无法调用这些 App 的通道。
    # 若这类 App 通话异常，应排查节点 UDP 支持与分流规则，而不是往这里加域名。

    # 【D 组】游戏主机 STUN —— 低风险，默认放开
    # 仅主机固件的 NAT 类型检测会请求，浏览器 JS 触及不到，不构成泄漏面。
    # 屏蔽只会让 PS / Switch / Xbox 联机变差，没有隐私收益。见下方「游戏平台」分组。
    - '+.stun.playstation.net'

    # > 网络连通性检测 / Captive Portal
    - 'cable.auth.com'
    - 'network-test.debian.org'
    - 'detectportal.firefox.com'
    - 'resolver1.opendns.com'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
    - 'captive.apple.com'
    - '*.connectivitycheck.gstatic.com'
    - 'clients3.google.com'
    - 'clients4.google.com'

    # > NTP 时间同步
    - '+.pool.ntp.org'
    - '+.ntp.org.cn'
    - 'ntp.*.com'
    - 'ntp?.*.com'
    - 'time.*.com'
    - 'time?.*.com'
    - 'time.*.gov'
    - 'time.*.edu.cn'

    # > 路由管理
    - 'heartbeat.belkin.com'
    - '*.linksys.com'
    - '*.linksyssmartwifi.com'
    - '*.router.asus.com'
    - '*.hiwifi.com'
    - '*.miwifi.com'
    - '*.routerlogin.com'
    - '*.mymeraki.com'
    - '*.gl-inet.com'
    # 国内常见路由器管理域名（原列表缺失，实际使用率远高于上面几个海外品牌）
    - '*.tplinkwifi.net'
    - '*.tendawifi.com'
    - '*.melogin.cn'
    - '*.falogin.cn'

    # > 本地 DNS 拦截工具
    - 'injections.adguard.org'
    - 'local.adguard.org'

    # > Apple 服务
    - 'mesu.apple.com'
    - 'swscan.apple.com'
    - 'swquery.apple.com'
    - 'swdownload.apple.com'
    - 'swcdn.apple.com'
    - 'swdist.apple.com'
    - '*.apple.com.edgesuite.net'
    - 'push-apple.com.akadns.net'

    # > Google 服务
    - 'lens.l.google.com'

    # > GitHub
    # 存疑分组，建议评估后再决定去留，详见下方说明：
    #    1) 冗余已清理：+.github.com 按本文件第 125 行的语义，已等同于
    #       github.com 与 *.github.com，原先的三条重复项已删除。
    #    2) 更重要的问题：GitHub 是需要走代理的域名，而放进 fake-ip-filter
    #       意味着客户端直接拿到真实 IP 去连接，Stash 此时只看得到目标 IP，
    #       DOMAIN 类规则可能失配，最终落到 GEOIP/兜底规则上，分流反而变差。
    #       （若已开启域名嗅探 sniffer，可从 TLS SNI 恢复域名，影响会小一些。）
    #    3) 原始用意是修 "git over SSH" 问题，但 SSH 经代理栈转发时 fake-ip
    #       本就工作正常。若你没有实际遇到 git 拉取失败，建议整组注释掉。
    # - '+.github.com'
    # - '+.githubusercontent.com'
    # - '+.githubapp.com'
    # - '+.githubassets.com'

    # > 运营商一键登录 / 认证
    # 统一改用 +.：这类鉴权接口常出现两级以上子域，*. 只匹配一级会漏。
    - '+.cmpassport.com'
    - 'id6.me'
    - 'open.e.189.cn'
    - 'opencloud.wostore.cn'
    - 'id.mail.wo.cn'
    - 'mdn.open.wo.cn'
    - 'hmrz.wo.cn'
    - 'nishub1.10010.com'
    - 'enrichgw.10010.com'
    - '+.wosms.cn'
    - '+.jegotrip.com.cn'
    - '+.icitymobile.mobi'
    - '+.10099.com.cn'
    - '+.microdone.cn'

    # > 银行 / 支付
    - '+.pingan.com.cn'
    - '+.cmbchina.com'

    # > 腾讯本地回环
    - 'localhost.*.qq.com'
    - 'localhost.*.weixin.qq.com'

    # > 流媒体
    # B 站 PCDN 节点，本质是 P2P，会把自己解析到的 IP 写进对端交换的数据里
    - '+.mcdn.bilivideo.cn'

    # > 音乐服务（解锁）
    - '+.music.163.com'
    - '+.126.net' # 网易云 CDN 实为 m701.music.126.net 这类两级子域，必须用 +.
    - 'musicapi.taihe.com'
    - 'music.taihe.com'
    - 'songsearch.kugou.com'
    - 'trackercdn.kugou.com'
    - '+.kuwo.cn'
    - '+.joox.com'
    - 'api-jooxtt.sanook.com'
    - '+.y.qq.com'
    - 'streamoc.music.tc.qq.com'
    - 'mobileoc.music.tc.qq.com'
    - 'isure.stream.qqmusic.qq.com'
    - 'dl.stream.qqmusic.qq.com'
    - 'aqqmusic.tc.qq.com'
    - 'amobile.music.tc.qq.com'
