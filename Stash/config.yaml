    # > 音乐服务（解锁）
    - '+.music.163.com'
    - '+.126.net' # 网易云 CDN 实为 m701.music.126.net 这类两级子域，必须用 +.
    - 'musicapi.taihe.com'
    - 'music.taihe.com'
