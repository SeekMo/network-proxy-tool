# ------ 广告净化 ------ #
# - HTTPDNS拦截器，阻止常见的 HTTPDNS 服务器（勿直接启用）
# 该覆写内 16 条 IP-CIDR 规则未带 no-resolve，且覆写的 rules 会插入到本配置 rules 之前，启用后未被其前面规则命中的域名都会触发本地 DNS 解析，造成 DNS 泄露。
# 「替代方案」复制其规则自建覆写，为这 16 条 IP-CIDR 补上 no-resolve 后再启用。
# https://raw.githubusercontent.com/BOBOLAOSHIV587/Rules/main/JS/ASN-China/Stash-HTTPDNS.Block.stoverride
# - YouTube去广告
# https://raw.githubusercontent.com/jnlaoshu/MySelf/main/Stash/Script/YouTubeAdblock.stoverride

# ------ 网页优化 ------ #
# - google.cn 重定向到 google.com
# https://raw.githubusercontent.com/jnlaoshu/MySelf/master/Stash/Script/Google.stoverride

# ------ 功能增强 ------ #
# - Sub-Store 订阅管理(Stash已内置)
# https://raw.githubusercontent.com/sub-store-org/Sub-Store/master/config/Stash.stoverride
# - Script-Hub 脚本转换(Stash已内置)
# https://raw.githubusercontent.com/Script-Hub-Org/Script-Hub/main/modules/script-hub.stash.stoverride
# - Apple WLOC 定位修改
# https://raw.githubusercontent.com/Yu9191/wloc/refs/heads/main/modules/wloc.stoverride
