# =====================================
# 远程订阅服务
# =====================================
[server_remote]
# 远程服务器订阅模块，可直接订阅SSR，SS链接，以及QuantumultX格式的vmess/trojan/https订阅
# 其它格式可用 opt-parser 参数开启解析器导入使用
# img-url参数用于指定图标，格式要求同样为 108*108 的 png 图片，可远程，也可本地

# 公益订阅(仅供临时使用)
# 源节点名格式：🟢🇭🇰[🎬🤖📺🎭]_github.com/Ruk1ng001_0da15920
# 解析器参数说明（执行顺序：in/out → regex/regout → delreg → rename → sort → $index 编号）
#  - out=A+B             按“节点名”关键字删除节点，"+" 为或、"." 为与（in= 则是只保留匹配的）
#                        因在 delreg 之前执行，匹配的是未裁剪的原始节点名，故 🔴/⚪ 等前缀圆点可直接命中
#                        又因在 $index 之前执行，被删节点不占号，_node_序号 保持连续不断号
#  - regex/regout=正则    对节点“完整信息”(类型/端口/加密等)正则 保留/删除，需要更精细匹配时才用
#  - delreg=正则          按正则删除“节点名”中的字段
#  - rename=@新名         "@新名"为后缀、"旧名@"为前缀、"旧名@新名"为替换，多段用 "+" 连接
#  - $index0              节点序号占位符，0 为普通数字，1~8 为各种特殊数字字体
#  - sort=A>B>C           按关键词优先级把节点排到前面（"<" 则是排到后面），未匹配的排在最后
#                         排序发生在 $index 编号之前，所以 _node_序号 会跟着排序后的顺序递增
#                         [policy] 的 server-tag-regex 只能过滤、不能排序，故排序必须在此处做
# 两种方案「二选一」，注释掉不用的那行即可切换：
#  - delreg=[\[_].*  从第一个 "[" 或 "_" 起全部删除，仅保留 状态圆点+国旗。效果: 🟢🇭🇰_node_1
#           注：部分节点无 "[...]" 分类段（如 ⚪🏳️_github.com/...），故 "[" 与 "_" 都要匹配
#  - delreg=_github.*  只删除 "_github.com/..." 域名尾巴，保留分类图标段。效果: 🟢🇭🇰[🎬🤖📺🎭]_node_1
# 方案一
# https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml#out=🔴+⚪&delreg=[\[_].*&rename=@_node_$index0&sort=🟢>🟡>🟠, tag = 公益订阅1, update-interval = -1, opt-parser = true, enabled = true
# 方案二
# https://raw.githubusercontent.com/Ruk1ng001/freeSub/main/clash.yaml#out=🔴+⚪&delreg=_github.*&rename=@_node_$index0&sort=🟢>🟡>🟠, tag = 公益订阅1, update-interval = -1, opt-parser = true, enabled = true


# =====================================
# 本地代理服务
# =====================================
[server_local]
# 当前 QuantumultX 版本中，[server_local] 里自建节点的 tag 字段，对于 [policy] 策略组的 server-tag-regex 正则匹配“不生效”，所以，暂无法根据策略做分流。
# 解决方法：
#  - 1、在 QuantumultX 的「节点资源」设置中，「新建」本地资源文件 .snippet，将自建节点链接复制到此资源文件中，再通过「资源-节点」设置中的「资源路径」，将此文件导入，同时打开「资源解析器」。
#    说明：此文件会保存在手机的 文件管理—— iCloud/我的iPhone —— Quantumult X —— Profiles 目录中
#  - 2、通过搭建 Sub-Store，对订阅进行管理，将自建节点转为订阅链接
#以上两种方法，会将自建节点封装到 [server_remote] 中，这样就可以实现本地节点走分流策略

#vless=xxxx.xyz:54321, method=none, password=xxxxx-xxxxx-xxxxx-xxxxx-xxxxx, obfs=over-tls, obfs-host=xxxx.com, tls-verification=false, reality-base64-pubkey=ie9Gg0mIdgfdsVcEBdt_CVAkCFPC_LXkUdscdseg, reality-hex-shortid=feb35400, vless-flow=xtls-rprx-vision, fast-open=false, udp-relay=true, tag = US_VPS


# =====================================
# 本地任务
# 三种任务类型: 定时任务脚本, UI交互查询脚本，网络切换脚本
# =====================================
[task_local]
# 1、定时任务脚本：可用于签到，天气话费查询等
# js文件放于 iCloud 或 本机 的QuantumultX/Scripts 路径下，TF版本可直接使用远程js链接
# 参数格式：
#    CRON表达式：从 “分” 开始的5位 CRON 写法
#    tag：task 命名标识
#    enabled：true/false 是否启用该任务
#    img-url：指定 task 的图标(108*108)
# 示例：
# 2 12 * * * sample.js, tag = 本地示范(左滑编辑，右滑执行), img-url = https://raw.githubusercontent.com/crossutility/Quantumult-X/master/quantumult-x.png, enabled = false
