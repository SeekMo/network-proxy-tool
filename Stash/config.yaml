# =====================================
# 远程分流规则集（拉取）
# 只拉取远程规则集合，不做具体分流动作
# =====================================
rule-providers:
# 规则集来源
#   - Loyalsoldier/clash-rules（~27.9k stars，Clash 生态标准）：国内直连补充、局域网
#   - MetaCubeX/meta-rules-dat（每日更新，v2fly 数据源）：AI/Google/Apple/GitHub/流媒体 等分类
#   - 自维护（rules/*.yaml）：对第三方规则集补充
# ------------------------------------------------------------
# 行为（behavior） | 格式 |      支持内容      | 匹配性能| 内存占用
#     domain       yaml     域名/域名通配符       优秀      低
#     domain       text	    域名/域名通配符       优秀      低
#     ipcidr       yaml	  IPv4/IPv6 CIDR格式	  优秀      低
#     ipcidr       text	  IPv4/IPv6 CIDR格式	  优秀      低
#    classical     yaml      任意规则类型        一般	     一般
#    classical     text      任意规则类型        一般	     一般

# 注意：Loyalsoldier/clash-rules 的文件虽以 .txt 结尾，内容却是 YAML（首行 payload:），须声明 format: yaml；
#      MetaCubeX 的 .list 为每行一条的纯文本，声明 format: text；.mrs 为 mihomo 二进制规则集，声明 format: mrs（仅支持 domain / ipcidr）。

  # 本地/局域网
  # 局域网 IP 及保留 IP 地址列表
  direct-lan:
    type: http
    behavior: ipcidr
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt
    path: ./rules/direct-lan.txt
    interval: 86400

  # 私有网络专用域名列表
  direct-local:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/private.txt
    path: ./rules/direct-local.txt
    interval: 86400

  # 广告拦截
  adblock:
    type: http
    behavior: domain
    format: yaml
    url: https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt
    path: ./rules/adblock-reject.txt
