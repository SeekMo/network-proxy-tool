# =====================================
# 本地分流规则（分流动作）
# 将远程分流的规则集合，进行本地分流
# ===================================== 
rules:
  # > QUIC 回落
  # 按协议识别 QUIC（HTTP/3）并拒绝，迫使浏览器/App 回落到 TCP + TLS，便于按域名分流。
  - PROTOCOL,QUIC,REJECT,no-track

  # ------------------------------------------------------------------
  # WebRTC 防泄漏 —— 必须放在所有 RULE-SET 之前，否则 STUN 会先命中直连规则
  #
  # 「默认·防泄漏模式」按协议识别 STUN 并拦截（不论域名/IP/端口，也不论直连或代理）。Stash 没有 stun-response-ip，这是拦住直连 STUN 最直接的手段。
  #  代价：ICE 连通检测与 UDP TURN 也使用 STUN 报文，Google Meet、网页版 Discord、FaceTime、Telegram/WhatsApp 通话的 UDP 通道会失败（部分可退回中继，质量下降）。
  #  若 Stash 版本不识别 PROTOCOL,STUN（配置加载报错），改用 script.shortcuts 中按端口拦截的备用规则：「- SCRIPT,webrtc-stun,REJECT,no-track」
  #  自测：Trickle ICE 中 stun:stun.l.google.com:19302、stun:stun.chat.bilibili.com:3478 均不应出现 srflx。
  #
  # 「通话模式配套」（默认关闭）
  # 【启用】放开下方 「PROTOCOL,STUN,兜底线路」 一行，通话结束后改回注释。
  # 【作用】STUN 一律走代理，srflx 显示节点 IP；不拦截 STUN 报文，通话可正常建立。
  # 【保险】默认模式的 REJECT 规则保持不动：Clash 内核在所选节点不支持 UDP 时会跳过该规则继续向下匹配（Stash 是否相同未核实），
  #        由其下方的 REJECT 兜住，避免 STUN 落到 bilibili、final-direct-ip 等直连规则而泄漏真实 IP。
  # 【前提】节点须支持 UDP 转发（Clash 格式节点需 udp: true），否则 STUN 被 REJECT 拦截，通话失败。
  # 【覆盖】Stash 严格从上到下匹配，协议规则位于最前，域名与 IP 形式的 STUN 均先命中本规则，
  #        无需像 Loon/QuantumultX 那样另加 STUN 的 DOMAIN 规则。QUIC 由上方 PROTOCOL,QUIC 继续屏蔽。
  # 【局限】通话媒体流（非 STUN）仍按其余规则分流，对方 IP 在国内时命中 final-direct-ip 走直连。
  # 【自测】Trickle ICE：srflx 应为节点 IP（与 ip.sb 一致）。
  # ------------------------------------------------------------------
  # - PROTOCOL,STUN,兜底线路
  - PROTOCOL,STUN,REJECT,no-track
  # - SCRIPT,webrtc-stun,REJECT,no-track

  #
  # > 各 App 自身的防护（与本配置无关，建议常开）：
  #  - Telegram：设置 → 隐私与安全 → 通话 → 点对点 → 「永不」（通话经官方服务器中转，对方看不到你的 IP）
  #  - WhatsApp：设置 → 隐私 → 高级 → 「在通话中保护 IP 地址」
  # ------------------------------------------------------------------

  # 安全防护检测，避免检测站被规则集分到直连，导致测试结果失真
  - DOMAIN-SUFFIX,browserleaks.com,兜底线路
  - DOMAIN-SUFFIX,browserleaks.net,兜底线路
  - DOMAIN-SUFFIX,browserleaks.org,兜底线路
  - DOMAIN-SUFFIX,ipleak.net,兜底线路
  - DOMAIN-SUFFIX,dnsleaktest.com,兜底线路
  - DOMAIN-SUFFIX,whoer.net,兜底线路
  - DOMAIN-SUFFIX,test-ipv6.com,兜底线路
  - DOMAIN-SUFFIX,ip.sb,兜底线路
  - DOMAIN-SUFFIX,whatismyip.com,兜底线路
  - DOMAIN-SUFFIX,myip.la,兜底线路

  # 自定义规则 —— 本地/局域网、广告拦截
  - RULE-SET, direct-lan, DIRECT, no-resolve # ipcidr 类规则集支持 no-resolve 参数
  - RULE-SET, direct-local, DIRECT
  - RULE-SET, adblock, REJECT

  # 自定义规则
  # Stash 规则从上到下匹配，这 3 条会截走后续规则集的正确分流：google 截走 gemini/ai-service 的 39 条（Gemini → 谷歌服务而非 AI服务）、
  # youtube 规则集的 7 条（含 +.googlevideo.com，YouTube 视频流 → 谷歌服务）；相应域名已由 google、youtube、apple 等规则集覆盖，去掉对效率影响很小。
  # - DOMAIN-KEYWORD, apple, 苹果服务
  # - DOMAIN-KEYWORD, google, 谷歌服务
  # - DOMAIN-KEYWORD, youtube, YouTube

  # 远程分流规则集 —— 应用服务
  - RULE-SET, openai, AI服务
  - RULE-SET, anthropic, AI服务
  - RULE-SET, gemini, AI服务
  - RULE-SET, ai-service, AI服务

  - RULE-SET, telegram, Telegram
  - RULE-SET, twitter, Twitter
  - RULE-SET, facebook, Facebook
  - RULE-SET, tiktok, TikTok

  # MetaCubeX 的公司级规则集包含旗下子品牌域名（google 覆盖 youtube 全部 178 条，microsoft 覆盖 github 全部 64 条），
  # Stash 从上到下匹配，子品牌规则集必须排在公司规则集之前，否则 YouTube → 谷歌服务、GitHub → 微软服务（默认直连）
  - RULE-SET, youtube, YouTube
  - RULE-SET, google, 谷歌服务

  - RULE-SET, cryptocurrency, 数字加密

  - RULE-SET, apple, 苹果服务
  - RULE-SET, github, 兜底线路
  - RULE-SET, microsoft, 微软服务

  - RULE-SET, paypal, PayPal

  - RULE-SET, talkatone, 兜底线路

  - RULE-SET, pornhub, 其它流媒体
  - RULE-SET, categoryporn, 其它流媒体

  # - RULE-SET, douyin, 调控线路
  # - RULE-SET, tencent, 调控线路
  # - RULE-SET, baidu, 调控线路
  # - RULE-SET, xiaohongshu, 调控线路
  - RULE-SET, bilibili, 哔哩哔哩

  # 直连/代理 兜底
  - RULE-SET, final-direct-ip, DIRECT, no-resolve # ipcidr 类规则集支持 no-resolve 参数
  - RULE-SET, final-direct-domain, DIRECT
  # 此「代理规则集」较多，为提升匹配效率，而且最后有 "MATCH, 兜底线路" 配置作为兜底，故此处可屏蔽
  # - RULE-SET, final-proxy, 兜底线路

  # 根据 GEOIP 数据库判断IP是否属于CN地区，若匹配到，将走直连
  # 原规则不带 no-resolve：未命中前面规则的域名（如 browserleaks.com、httpbin.org）会先经 doh.pub / 阿里 DoH 在本地解析，泄露所访问的境外域名
  # - GEOIP, CN, DIRECT
  # 加 no-resolve：避免触发 DNS 解析，仅对纯 IP 请求生效，未命中规则的域名不再在本地解析，请求直接落到 MATCH
  # 副作用：未被规则集收录的国内小站会走「兜底线路」，如有必要，可单独为其写 DOMAIN-SUFFIX 直连规则
  - GEOIP,CN,DIRECT,no-resolve

  # 当以上所有 本地/远程 规则都未匹配到时，将使用 MATCH 规则的策略
  #- MATCH, PROXY
  - MATCH, 兜底线路